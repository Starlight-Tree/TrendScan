            <button type="button" role="tab" class="result-area__tab" id="tab-services" data-tab="services" aria-controls="tab-panel" aria-selected="false" tabindex="-1">AI チャット</button>

        <div class="page">

          <h1 class="visually-hidden" id="page-title">ランキング</h1>

            <h2 class="page-lead__heading" id="lead-heading" hidden></h2>
            <p id="lead-text"></p>
            <p class="page-lead__source" id="lead-source" hidden></p>
          </div>

          <div id="tab-panel" role="tabpanel" aria-labelledby="tab-languages">
            <p id="status" class="visually-hidden" role="status"></p>

                      </button>

                      <button type="button" class="icon-button" data-for="rates earnings" data-value="world">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c2 2 3 4.400 3 7s-1 5-3 7c-2-2-3-4.400-3-7s1-5 3-7z"/></svg>

                    </div>
                    <!-- 順位と推移の切り替え -->
                    <div id="view-toggle" class="view-switch" role="group" aria-label="順位と推移" hidden>
                      <button type="button" class="icon-button" data-value="ranking">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.500 5h9M7.500 10h9M7.500 15h9M3.500 5h.01M3.500 10h.01M3.500 15h.01"/></svg>
                      </button>
                      <button type="button" class="icon-button" data-value="history">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.500v13h14"/><path d="M6 12.500l3.500-4 2.500 2.500 4.500-5.500"/></svg>

                    </div>
                  </div>
                </div>

                <p id="card-note" class="note" hidden></p>
                <div id="card-message" class="list-message" tabindex="-1" hidden>
                  <p id="card-message-text"></p>
                  <button type="button" class="btn btn--small" id="retry-button" hidden>もう一度読み込む</button>
                </div>

                <!-- ニュースと動画のリンクの一覧 -->
                <ul id="link-list" class="news-list" hidden></ul>

                <div id="ranking-panel">
                <div class="table-scroll">
                  <table class="ranking" id="ranking-table">
                    <thead>
                      <tr id="ranking-head"></tr>
                    </thead>
                    <tbody id="ranking-body"></tbody>
                  </table>
                </div>
                <!-- 表の下の注記 -->
                <p class="note table-note" id="table-note" hidden></p>
                </div>

                <div id="history-panel" hidden>
                <div id="chart" class="chart"></div>
                <div id="legend" class="legend" role="group" aria-label="グラフに表示する名前"></div>
                <p class="note legend-note" id="legend-note" hidden></p>
                <details class="table-view">
                  <summary>推移を表で見る</summary>
                  <div class="table-scroll">
                    <table id="history-table"></table>
                  </div>
                </details>
                </div>
              </div>

              <p class="page-notice" id="page-notice" hidden></p>
